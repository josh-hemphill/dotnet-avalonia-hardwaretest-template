name: CI

on:
  push:
    branches: [latest, main, master]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  # Manual dispatch always runs full and uploads both publish artifacts.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      full: ${{ steps.profile.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.7
      - id: profile
        name: Classify dependencies (unknown changes require full validation)
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: deno run -A tools/ci/profile.ts

  linux:
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        suite: [host, ui, vm, quality]
    uses: ./.github/workflows/ci-suite.yml
    with:
      rid: linux-x64
      suite: ${{ matrix.suite }}
      profile: ${{ needs.policy.outputs.profile }}

  windows:
    needs: policy
    uses: ./.github/workflows/ci-suite.yml
    with:
      rid: win-x64
      suite: windows
      profile: ${{ needs.policy.outputs.profile }}

  publish-win:
    needs: policy
    if: needs.policy.outputs.full == 'true'
    uses: ./.github/workflows/ci-suite.yml
    with:
      rid: win-x64
      suite: publish
      profile: full

  publish-linux:
    needs: policy
    if: needs.policy.outputs.full == 'true'
    uses: ./.github/workflows/ci-suite.yml
    with:
      rid: linux-x64
      suite: publish
      profile: full

  # Preserve required check identities. Never turn a failed/missing required
  # child into a successful aggregate through GitHub's implicit skip handling.
  test:
    if: always()
    needs: [policy, windows, publish-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.7
      - name: Require successful Windows children
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REQUIRED: ${{ needs.policy.outputs.full == 'true' && 'policy,windows,publish-win' || 'policy,windows' }}
          CI_OPTIONAL: ${{ needs.policy.outputs.full != 'true' && 'publish-win' || '' }}
        run: deno run -A tools/ci/profile.ts aggregate

  test-linux:
    if: always()
    needs: [policy, linux, publish-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.7
      - name: Require successful Linux children
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REQUIRED: ${{ needs.policy.outputs.full == 'true' && 'policy,linux,publish-linux' || 'policy,linux' }}
          CI_OPTIONAL: ${{ needs.policy.outputs.full != 'true' && 'publish-linux' || '' }}
        run: deno run -A tools/ci/profile.ts aggregate
