name: CI

on:
  # Push only on integration branches. Feature-branch CI is pull_request-only so a
  # push to an open PR does not fire a second identical run for the same commit.
  # Branches without a PR can still be verified via workflow_dispatch.
  push:
    branches: [latest, main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            Directory.Build.props
            dirs.proj

      - name: Build
        run: dotnet build dirs.proj -c Release -r win-x64

      - name: Format check
        continue-on-error: true
        run: dotnet format dirs.proj --verify-no-changes --no-restore

      - name: "OpenTAP host + fixtures (serial collection)"
        run: >
          dotnet test tests/HardwareTest.Tests/HardwareTest.Tests.csproj
          -c Release -r win-x64 --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/coverage.runsettings
          --results-directory artifacts/coverage

      - name: "ViewModels (FakeOpenTap — UI/board)"
        run: >
          dotnet test tests/HardwareTest.ViewModels.Tests/HardwareTest.ViewModels.Tests.csproj
          -c Release -r win-x64 --no-build

      - name: "E2E smoke (sample + Inspect shell wiring)"
        run: >
          dotnet test tests/HardwareTest.E2E.Tests/HardwareTest.E2E.Tests.csproj
          -c Release -r win-x64 --no-build

      - name: Coverage floors
        shell: bash
        run: |
          set -euo pipefail
          cobertura=$(find artifacts/coverage -name 'coverage.cobertura.xml' | head -n 1)
          if [[ -z "${cobertura}" ]]; then
            echo "coverage.cobertura.xml not found" >&2
            exit 1
          fi
          python tests/check-coverage.py "${cobertura}"

  publish-appliance:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            Directory.Build.props
            dirs.proj

      - name: Self-contained publish smoke (win-x64, non-AoT)
        run: dotnet publish src/HardwareTest -c Release -r win-x64 --self-contained -p:PublishAot=false

  # Optional follow-up: add linux-x64 publish + DUT→run→report smoke when runners are ready.
