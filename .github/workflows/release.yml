name: HardwareTest release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/ci/release*.ts'
      - 'starters/test-set/**'
      - 'licenses/**'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching VersionPrefix (e.g. v0.1.0-preview.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hardwaretest-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CI_RID: ${{ matrix.rid }}
      RELEASE_TAG: ${{ inputs.tag }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/hardwaretest-dotnet
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 libfreetype6 libice6 libsm6 \
            libx11-6 libxcursor1 libxext6 libxi6 libxrandr2 libxrender1
      - name: Publish and verify the release archive
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec node tools/ci/main.ts publish --rid "$CI_RID"
          pnpm exec node tools/ci/release.ts bundle "$CI_RID" "artifacts/release-native" "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release-native/
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: native
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: native
      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec node tools/ci/release.ts collect native artifacts/release "$RELEASE_TAG"
          cd artifacts/release
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardwaretest-release
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hardwaretest-release
          path: release
      - name: Create the GitHub release draft
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS.txt
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -n "$existing" ]]; then
            echo "Choose a new tag. Existing release tags are preserved." >&2
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Matched Authoring and Operator builds for Windows x64 and Linux x64, with a starter test-set repository.

          Verify downloads with \`SHA256SUMS.txt\`. See the starter README for the path from a sample workspace to a checked program package.

          Source and build instructions: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA

          Application archives include source references, HardwareTest MIT notices, the miPDFlib Apache-2.0 license and notice, and the IVI Foundation VISA agreement.
          NOTES
          gh release create "$RELEASE_TAG" ./* --draft --target "$GITHUB_SHA" "${flags[@]}" \
            --title "HardwareTest $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
